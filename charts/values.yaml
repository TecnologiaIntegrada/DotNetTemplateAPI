replicaCount: 1

image:
  repository: ghcr.io/TecnologiaIntegrada/DotNetTemplateAPI
  tag: "main"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

postgresql:
  enabled: true
  serviceName: postgresql-service
  secretName: postgresql-secret
  database: appdatabase
  username: postgres
  password: postgres
  storage: 10Gi

seq:
  enabled: true
  serviceName: seq-service
  version: "2024.1"
  storage: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

namespace: dev

ingress:
  enabled: false
  host: dotnettemplateapi.canada-software.com
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: api-tls-cert

