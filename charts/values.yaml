replicaCount: 1

image:
  repository: canadasoftware/api-dotnet
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

postgresql:
  enabled: true
  serviceName: postgresql-service
  secretName: postgresql-secret
  database: appdatabase
  username: postgres
  password: postgres
  storage: 10Gi

seq:
  enabled: true
  serviceName: seq-service
  version: "2024.1"
  storage: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

namespace: dev

