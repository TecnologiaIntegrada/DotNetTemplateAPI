{{- if .Values.seq.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-data-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.seq.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.seq.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: seq
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 5341
      targetPort: 5341
      protocol: TCP
      name: ingestion
  selector:
    app: seq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: {{ .Values.namespace }}
  labels:
    app: seq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
      - name: seq
        image: datalust/seq:{{ .Values.seq.version }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        - containerPort: 5341
          name: ingestion
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SEQ_API_CANONICALURI
          value: "http://{{ .Values.seq.serviceName }}:80"
        resources:
          {{- toYaml .Values.seq.resources | nindent 12 }}
        volumeMounts:
        - name: seq-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: seq-data
        persistentVolumeClaim:
          claimName: seq-data-pvc
{{- end }}

