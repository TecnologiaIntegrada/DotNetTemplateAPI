apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnettemplateapi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/TecnologiaIntegrada/DotNetTemplateAPI.git
    targetRevision: main
    path: charts
    helm:
      valueFiles:
        - values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  
  revisionHistoryLimit: 3

