apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canadasoftware-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/TecnologiaIntegrada/DotNetTemplateAPI.git
    targetRevision: main
    path: charts
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "main"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10

